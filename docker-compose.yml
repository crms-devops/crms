version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: crms_db
    environment:
      POSTGRES_DB: crms_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crmspassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crms_backend
    environment:
      DATABASE_URL: postgresql://postgres:crmspassword@db:5432/crms_dev
      SECRET_KEY: crms-dev-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crms_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: