apiVersion: apps/v1
kind: Deployment
metadata:
  name: crms-kafka
  namespace: crms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crms-kafka
  template:
    metadata:
      labels:
        app: crms-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "crms-zookeeper-service:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://crms-kafka-service:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx256m -Xms128m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "256m"
---
apiVersion: v1
kind: Service
metadata:
  name: crms-kafka-service
  namespace: crms
spec:
  selector:
    app: crms-kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crms-zookeeper
  namespace: crms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crms-zookeeper
  template:
    metadata:
      labels:
        app: crms-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx128m -Xms64m"
          resources:
            requests:
              memory: "128Mi"
              cpu: "75m"
            limits:
              memory: "256Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: crms-zookeeper-service
  namespace: crms
spec:
  selector:
    app: crms-zookeeper
  ports:
    - port: 2181
      targetPort: 2181
