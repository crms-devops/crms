apiVersion: apps/v1
kind: Deployment
metadata:
  name: crms-db
  namespace: crms
  labels:
    app: crms-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crms-db
  template:
    metadata:
      labels:
        app: crms-db
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: crms_dev
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: crmspassword
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          emptyDir: {}
        - name: postgres-tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crms-db-service
  namespace: crms
spec:
  selector:
    app: crms-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
