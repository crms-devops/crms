apiVersion: apps/v1
kind: Deployment
metadata:
  name: crms-db
  namespace: crms
  labels:
    app: crms-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crms-db
  template:
    metadata:
      labels:
        app: crms-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: crms_dev
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: crmspassword
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crms-db-service
  namespace: crms
spec:
  selector:
    app: crms-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP