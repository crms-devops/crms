apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crms-backend-hpa
  namespace: crms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crms-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crms-frontend-hpa
  namespace: crms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crms-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70