apiVersion: apps/v1
kind: Deployment
metadata:
  name: crms-frontend
  namespace: crms
  labels:
    app: crms-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crms-frontend
  template:
    metadata:
      labels:
        app: crms-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/crms-devops/crms-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crms-frontend-service
  namespace: crms
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: crms-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer