apiVersion: apps/v1
kind: Deployment
metadata:
  name: crms-backend
  namespace: crms
  labels:
    app: crms-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crms-backend
  template:
    metadata:
      labels:
        app: crms-backend
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: app-cache
          emptyDir: {}
        - name: db-secret
          secret:
            secretName: crms-secrets
      containers:
        - name: backend
          image: ghcr.io/crms-devops/crms-backend:v0.15.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          env:
            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: crms-config
                  key: ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: crms-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crms-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: crms-secrets
                  key: SECRET_KEY
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: app-cache
              mountPath: /app/__pycache__
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: crms-backend-service
  namespace: crms
spec:
  selector:
    app: crms-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP