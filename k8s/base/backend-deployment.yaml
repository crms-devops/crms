apiVersion: apps/v1
kind: Deployment
metadata:
  name: crms-backend
  namespace: crms
  labels:
    app: crms-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crms-backend
  template:
    metadata:
      labels:
        app: crms-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/crms-devops/crms-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crms-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: crms-secrets
                  key: SECRET_KEY
            - name: ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: crms-config
                  key: ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: crms-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: crms-backend-service
  namespace: crms
spec:
  selector:
    app: crms-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP