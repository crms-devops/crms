name: DevSecOps DAST - Dynamic Analysis

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:

  # GATE 10: OWASP ZAP - DAST scan
  # Spins up the full CRMS stack
  # ZAP attacks the running application
  # Generates full penetration test report

  owasp-zap:
    name: "Gate 10 - OWASP ZAP DAST Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name crms-test-db \
            --network host \
            -e POSTGRES_DB=crms_dev \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=crmspassword \
            postgres:16-alpine
          sleep 10
          docker exec crms-test-db pg_isready -U postgres

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:crmspassword@localhost:5432/crms_dev
        run: |
          cd backend
          alembic upgrade head

      - name: Start FastAPI backend
        env:
          DATABASE_URL: postgresql://postgres:crmspassword@localhost:5432/crms_dev
          SECRET_KEY: zap-test-secret-key-not-for-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          KAFKA_BOOTSTRAP_SERVERS: ""
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          curl -f http://localhost:8000/health || exit 1
          echo "Backend is up"

      - name: Create ZAP auth script
        run: |
          mkdir -p zap
          cat > zap/auth-script.js << 'EOF'
          var HttpRequestHeader = Java.type("org.parosproxy.paros.network.HttpRequestHeader");
          var HttpHeader = Java.type("org.parosproxy.paros.network.HttpHeader");
          var URI = Java.type("org.apache.commons.httpclient.URI");

          function authenticate(helper, paramsValues, credentials) {
            var loginUrl = paramsValues.get("Login URL");
            var requestBody = '{"register_number":"' + credentials.getParam("register_number") + '","date_of_birth":"' + credentials.getParam("date_of_birth") + '"}';

            var requestUri = new URI(loginUrl, false);
            var requestMethod = HttpRequestHeader.POST;
            var requestHeader = new HttpRequestHeader(requestMethod, requestUri, HttpHeader.HTTP11);
            requestHeader.setHeader("Content-Type", "application/json");

            var msg = helper.prepareMessage();
            msg.setRequestHeader(requestHeader);
            msg.setRequestBody(requestBody);
            helper.sendAndReceive(msg);

            return msg;
          }

          function getRequiredParamsNames() {
            return ["Login URL"];
          }

          function getOptionalParamsNames() {
            return [];
          }

          function getCredentialsParamsNames() {
            return ["register_number", "date_of_birth"];
          }
          EOF

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: false
          allow_issue_writing: false
          artifact_name: ""

      - name: Run OWASP ZAP API scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: "http://localhost:8000/openapi.json"
          format: openapi
          fail_action: false
          allow_issue_writing: false
          artifact_name: ""

      - name: Display ZAP summary
        if: always()
        run: |
          if [ -f report_json.json ]; then
            python3 -c "
          import json
          try:
            data = json.load(open('report_json.json'))
            alerts = data.get('site', [{}])[0].get('alerts', [])
            high = [a for a in alerts if a.get('riskcode') == '3']
            medium = [a for a in alerts if a.get('riskcode') == '2']
            low = [a for a in alerts if a.get('riskcode') == '1']
            print(f'ZAP DAST Results:')
            print(f'  HIGH:   {len(high)}')
            print(f'  MEDIUM: {len(medium)}')
            print(f'  LOW:    {len(low)}')
            for a in high:
              print(f'  [HIGH] {a.get(\"alert\")}: {a.get(\"url\")}')
          except Exception as e:
            print(f'Could not parse ZAP report: {e}')
          "
          fi

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30

      - name: Create ZAP rules file
        run: |
          mkdir -p .zap
          cat > .zap/rules.tsv << 'EOF'
          10015	IGNORE	(Incomplete or No Cache-control Header Set)
          10016	IGNORE	(Web Browser XSS Protection Not Enabled)
          10017	IGNORE	(Cross-Domain JavaScript Source File Inclusion)
          10019	IGNORE	(Content-Type Header Missing)
          10021	IGNORE	(X-Content-Type-Options Header Missing)
          10035	IGNORE	(Strict-Transport-Security Header Not Set)
          10037	IGNORE	(Server Leaks Information via X-Powered-By HTTP Response Header Field)
          10038	IGNORE	(Content Security Policy Not Set)
          10098	IGNORE	(Cross-Domain Misconfiguration)
          EOF